<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bleibsichtbar Test</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .wrapper {
    width: 100%;
    max-width: 1400px;
    padding: 40px 30px;
  }

  .row {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    justify-content: space-between;
    align-items: center;
    gap: 30px;
  }

  .side {
    flex: 1;
    display: flex;
    align-items: center;
  }

  .side-left  { justify-content: flex-start; }
  .side-right { justify-content: flex-end; }

  .logo-wrap {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
  }

  .logo-wrap img {
    width: 900px;
    max-width: 90vw;
    height: auto;
    display: block;
  }

  /* Mobil / dar ekran: dikey sıralama - yeşil (sol) üstte, logo ortada, mavi (sağ) altta */
  @media (max-width: 860px) {
    .row {
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .side {
      width: 100%;
      justify-content: center !important;
    }

    .logo-wrap {
      position: static;
      transform: none;
      order: 0;
      width: 100%;
    }

    .logo-wrap img {
      width: 320px;
    }

    .side-left  { order: -1; }
    .side-right { order: 1; }
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="row">

    <!-- SOL AGENT (yeşil) -->
    <div class="side side-left">
      <elevenlabs-convai
        agent-id="agent_7801m3crfw5be5kawyn9atw5t1jy"
        dynamic-variables='{"mandator_name":"nova.de","debtor_first_name":"helmut","debtor_last_name":"Maier","date_of_birth":"20 März 1996","debt_amount_total":"200","currency":"EUR"}'>
      </elevenlabs-convai>
    </div>

    <!-- ORTA LOGO -->
    <div class="logo-wrap">
      <img
        src="/images/b2b-voice-logo.png"
        alt="B2B Voice"
      >
    </div>

    <!-- SAĞ AGENT (mavi) -->
    <div class="side side-right">
      <elevenlabs-convai
        agent-id="agent_7001m4ryf8f4frnbhq21cgv0r3dj"
        dynamic-variables='{"mandator_name":"nova.de","debtor_first_name":"helmut","debtor_last_name":"Maier","date_of_birth":"20 März 1996","debt_amount_total":"200","currency":"EUR"}'>
      </elevenlabs-convai>
    </div>

  </div>
</div>

<script
  src="https://unpkg.com/@elevenlabs/convai-widget-embed"
  async
  type="text/javascript">
</script>

</body>
</html>
